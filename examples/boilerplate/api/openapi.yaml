openapi: 3.1.0
info:
  title: Go Bluprint API
  version: 1.0.0
  description: |
    Contract of the service API. This file is the source of truth: the Go
    server code in internal/interfaces/http/apigen is generated from it with
    `make generate`, and a test fails when the router and this file drift.

    Health probes (`/healthz`, `/readyz`, `/livez`) are operational endpoints
    and are not part of this contract.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: audit
    description: Read-only access to the audit log.
  # vogel:component bpms begin
  - name: bpms
    description: Process definitions and the cases that run them.
  # vogel:component bpms end
paths:
  /audit:
    get:
      operationId: listAuditEntries
      tags: [audit]
      summary: List audit entries
      description: Returns a filtered, paginated list of audit log entries.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ResourceType"
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/OperationCategory"
        - $ref: "#/components/parameters/OperationName"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/AggregateType"
        - $ref: "#/components/parameters/AggregateID"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryListResponse"
        "400":
          description: |
            Invalid filters (one message per parameter in `fields`), or an
            offset past the maximum (a single `field`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /audit/{id}:
    get:
      operationId: getAuditEntry
      tags: [audit]
      summary: Get audit entry
      description: Returns a single audit log entry by ID.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The audit entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # vogel:component bpms begin
  /processes:
    post:
      operationId: publishProcess
      tags: [bpms]
      summary: Publish a process definition
      description: Compiles the definition and publishes it as the next version of its name.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProcessSpec"}
      responses:
        "201":
          description: The published version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublishedProcessResponse"}
        "400":
          $ref: "#/components/responses/BpmsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /processes/{name}:
    get:
      operationId: getLatestProcess
      tags: [bpms]
      summary: Get the latest process version
      description: Returns the latest published version of a process and its definition.
      parameters:
        - $ref: "#/components/parameters/ProcessName"
      responses:
        "200":
          description: The latest version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProcessVersionResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /processes/{name}/cases:
    post:
      operationId: startCase
      tags: [bpms]
      summary: Start a case
      description: Opens a case of the latest version of a process and submits its first action.
      parameters:
        - $ref: "#/components/parameters/ProcessName"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Submission"}
      responses:
        "201":
          description: The new case.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseResponse"}
        "400":
          $ref: "#/components/responses/BpmsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /inbox:
    get:
      operationId: listInbox
      tags: [bpms]
      summary: List the inbox
      description: Returns the open cases the caller can act on.
      responses:
        "200":
          description: The cases of the caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseListResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /cases/{id}:
    get:
      operationId: getCase
      tags: [bpms]
      summary: Get a case
      description: Returns a case with its current values and history.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseViewResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /cases/{id}/claim:
    post:
      operationId: claimCase
      tags: [bpms]
      summary: Claim a case
      description: Assigns the case to the caller.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The claimed case.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseResponse"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /cases/{id}/submit:
    post:
      operationId: submitCase
      tags: [bpms]
      summary: Submit an action
      description: Submits an action with its form values on a case the caller holds.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Submission"}
      responses:
        "200":
          description: The case after the action.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CaseResponse"}
        "400":
          $ref: "#/components/responses/BpmsBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  # vogel:component bpms end

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # Parameters are documented with their real types and limits, but generated
  # as plain strings (x-go-type: string) and not bound by the generated code:
  # the handlers validate them with vogel's request.Validator, which owns the
  # error messages clients see.
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Resource ID.
      schema: {type: string, format: uuid, x-go-type: string}
  # vogel:component bpms begin
    ProcessName:
      name: name
      in: path
      required: true
      description: Process name.
      schema: {type: string, x-go-type: string}
  # vogel:component bpms end
    ActorID:
      name: actor_id
      in: query
      description: Filter by actor ID.
      schema: {type: string, maxLength: 256, x-go-type: string}
    ResourceType:
      name: resource_type
      in: query
      description: Filter by resource type.
      schema: {type: string, maxLength: 256, x-go-type: string}
    ResourceID:
      name: resource_id
      in: query
      description: Filter by resource ID.
      schema: {type: string, format: uuid, x-go-type: string}
    OperationCategory:
      name: operation_category
      in: query
      description: Filter by operation category.
      schema: {type: string, enum: [create, update, delete, execute], x-go-type: string}
    OperationName:
      name: operation_name
      in: query
      description: Filter by operation name.
      schema: {type: string, maxLength: 256, x-go-type: string}
    Status:
      name: status
      in: query
      description: Filter by outcome.
      schema: {type: string, enum: [success, failed, partial, noop], x-go-type: string}
    AggregateType:
      name: aggregate_type
      in: query
      description: Filter by aggregate type.
      schema: {type: string, maxLength: 256, x-go-type: string}
    AggregateID:
      name: aggregate_id
      in: query
      description: Filter by aggregate ID.
      schema: {type: string, maxLength: 256, x-go-type: string}
    From:
      name: from
      in: query
      description: Only entries created at or after this time (RFC 3339).
      schema: {type: string, format: date-time, x-go-type: string}
    To:
      name: to
      in: query
      description: Only entries created at or before this time (RFC 3339).
      schema: {type: string, format: date-time, x-go-type: string}
    Limit:
      name: limit
      in: query
      description: Page size. Values above 100 are treated as 100.
      schema: {type: integer, minimum: 0, default: 20, x-go-type: string}
    Offset:
      name: offset
      in: query
      description: Number of entries to skip. Narrow the filters instead of paging past the maximum.
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0, x-go-type: string}

  responses:
    ValidationError:
      description: One or more inputs are invalid.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ValidationErrorResponse"}
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Forbidden:
      description: The caller lacks permission for this action.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}

  # vogel:component bpms begin
    BpmsBadRequest:
      description: |
        Invalid JSON body (INVALID_JSON), or form values that fail their
        rules (VALIDATION_ERROR with one message per field).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/BadRequestResponse"}
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    UnprocessableEntity:
      description: The definition does not compile.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  # vogel:component bpms end
  schemas:
    # vogel/httpx/response envelopes; a test checks them against vogel's types.
    # x-order keeps the generated fields in vogel's JSON order.
    ErrorResponse:
      type: object
      required: [success, message, code]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        code: {type: string, description: "Stable error class, e.g. NOT_FOUND."}
        error: {type: string, description: "Stable per-domain error identifier, when set."}
        field: {type: string, description: "Offending input field, when the error belongs to one."}
        request_id: {type: string, description: Identifies the request in the server logs.}
    ValidationErrorResponse:
      type: object
      required: [success, message, code, fields]
      properties:
        success: {type: boolean, const: false}
        message: {type: string}
        code: {type: string, const: VALIDATION_ERROR}
        fields:
          type: object
          additionalProperties: {type: string}
          description: One message per invalid input, keyed by its name.
        request_id: {type: string, description: Identifies the request in the server logs.}
    ListMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total: {type: integer, x-order: 1}
        limit: {type: integer, x-order: 2}
        offset: {type: integer, x-order: 3}

    AuditEntryResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, x-order: 1}
        message: {type: string, x-order: 2}
        data: {$ref: "#/components/schemas/AuditEntry", x-order: 3}
    AuditEntryListResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success: {type: boolean, x-order: 1}
        message: {type: string, x-order: 2}
        data:
          type: array
          items: {$ref: "#/components/schemas/AuditEntry"}
          x-order: 3
        meta: {$ref: "#/components/schemas/ListMeta", x-order: 4}

    # Generated as vogel's own DTO (x-go-type), so the server cannot drift
    # from what vogel serializes; a test checks these properties against the
    # DTO's JSON tags.
    AuditEntry:
      type: object
      x-go-type: httpx.Response
      x-go-type-import:
        path: github.com/kafeiih/vogel/audit/httpx
      required:
        - id
        - resource_type
        - resource_id
        - operation_category
        - operation_name
        - status
        - actor_id
        - username
        - source
        - ip
        - user_agent
        - created_at
      properties:
        id: {type: string, format: uuid}
        resource_type: {type: string}
        resource_id: {type: string}
        aggregate_type: {type: string}
        aggregate_id: {type: string}
        operation_category: {type: string, enum: [create, update, delete, execute]}
        operation_name: {type: string}
        status: {type: string, enum: [success, failed, partial, noop]}
        actor_id: {type: string}
        username: {type: string}
        source: {type: string}
        request_id: {type: string}
        ip: {type: string}
        user_agent: {type: string}
        object_repr: {type: string}
        input_payload: {type: object, additionalProperties: true}
        before_snapshot: {type: object, additionalProperties: true}
        after_snapshot: {type: object, additionalProperties: true}
        changed_fields: {type: object, additionalProperties: true}
        affected_resources:
          type: array
          items: {$ref: "#/components/schemas/AffectedResource"}
        error_code: {type: string}
        error_message: {type: string}
        created_at: {type: string, format: date-time}
    AffectedResource:
      type: object
      required: [type, id]
      properties:
        type: {type: string}
        id: {type: string}
  # vogel:component bpms begin

    BadRequestResponse:
      anyOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - $ref: "#/components/schemas/ValidationErrorResponse"
    # The definition is passed to the domain parser untouched (json.RawMessage),
    # which owns its validation and error messages.
    ProcessSpec:
      type: object
      x-go-type: json.RawMessage
      required: [name, nodes, transitions]
      properties:
        name: {type: string}
        nodes: {type: array, items: {type: object}}
        transitions: {type: array, items: {type: object}}
    PublishedProcess:
      type: object
      required: [name, version]
      properties:
        name: {type: string, x-order: 1}
        version: {type: integer, x-order: 2}
    ProcessVersion:
      type: object
      required: [spec, version]
      properties:
        spec:
          type: object
          description: The published definition.
          x-go-type: json.RawMessage
          x-order: 1
        version: {type: integer, x-order: 2}
    Submission:
      type: object
      properties:
        action: {type: string}
        values: {type: object, additionalProperties: true}
    Case:
      type: object
      required: [id, process, version, state, status, openedAt]
      properties:
        id: {type: string, format: uuid, x-order: 1}
        process: {type: string, x-order: 2}
        version: {type: integer, x-order: 3}
        state: {type: string, x-order: 4}
        status: {type: string, x-order: 5}
        assignedTo: {type: string, x-order: 6}
        openedAt: {type: string, format: date-time, x-order: 7}
        closedAt: {type: string, format: date-time, x-order: 8}
    CaseView:
      type: object
      required: [id, process, version, state, status, openedAt, values, history]
      properties:
        id: {type: string, format: uuid, x-order: 1}
        process: {type: string, x-order: 2}
        version: {type: integer, x-order: 3}
        state: {type: string, x-order: 4}
        status: {type: string, x-order: 5}
        assignedTo: {type: string, x-order: 6}
        openedAt: {type: string, format: date-time, x-order: 7}
        closedAt: {type: string, format: date-time, x-order: 8}
        values: {type: object, additionalProperties: true, x-order: 9}
        history:
          type: array
          items: {$ref: "#/components/schemas/CaseValue"}
          x-order: 10
    CaseValue:
      type: object
      required: [field, value, nodeId, actorId, recordedAt]
      properties:
        field: {type: string, x-order: 1}
        value: {description: The submitted value., x-order: 2}
        nodeId: {type: string, x-order: 3}
        actorId: {type: string, x-order: 4}
        recordedAt: {type: string, format: date-time, x-order: 5}
    PublishedProcessResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, x-order: 1}
        message: {type: string, x-order: 2}
        data: {$ref: "#/components/schemas/PublishedProcess", x-order: 3}
    ProcessVersionResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, x-order: 1}
        message: {type: string, x-order: 2}
        data: {$ref: "#/components/schemas/ProcessVersion", x-order: 3}
    CaseResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, x-order: 1}
        message: {type: string, x-order: 2}
        data: {$ref: "#/components/schemas/Case", x-order: 3}
    CaseListResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, x-order: 1}
        message: {type: string, x-order: 2}
        data:
          type: array
          items: {$ref: "#/components/schemas/Case"}
          x-order: 3
    CaseViewResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, x-order: 1}
        message: {type: string, x-order: 2}
        data: {$ref: "#/components/schemas/CaseView", x-order: 3}
  # vogel:component bpms end
