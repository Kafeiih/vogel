# Change together with cerbos/tests, cerbos/smoke.sh, rolematrix_test.go and docs/CERBOS_POLICIES.md.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "audit:entry"
  rules:
    - actions: ["list"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["admin", "auditor"]
