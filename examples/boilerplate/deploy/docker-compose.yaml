# vogel:component worker begin
x-worker-schema: &worker-schema
  WORKER_SCHEMA: ${WORKER_SCHEMA:-river}

# vogel:component worker end
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-build: &build
  context: ../../..
  dockerfile: examples/boilerplate/Dockerfile

x-scrub-db-admin-secrets: &scrub-db-admin-secrets
  POSTGRES_PASSWORD: ""
  APP_MIGRATOR_PASSWORD: ""

services:
  # No ports and no TLS: keep it on this network; in production use sslmode=verify-full and DB_REQUIRE_TLS=true.
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: boilerplate_db
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in deploy/.env}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boilerplate_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/kafeiih/vogel-boilerplate:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    build:
      <<: *build
      target: api
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # vogel:component worker begin
      <<: *worker-schema
      # vogel:component worker end
      DB_URL: "postgres://app_migrator:${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in deploy/.env}@postgres:5432/boilerplate_db?sslmode=disable"
      DB_REQUIRE_TLS: "false"
    restart: "no"

  grants:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    <<: *hardened
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      # vogel:component worker begin
      - -v
      - worker_schema=${WORKER_SCHEMA:-river}
      # vogel:component worker end
      - -f
      - /grants/runtime-grants.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: boilerplate_db
      PGUSER: app_migrator
      PGPASSWORD: ${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in deploy/.env}
      PGSSLMODE: disable
    volumes:
      - ./initdb/runtime-grants.sql:/grants/runtime-grants.sql:ro
    restart: "no"

  # vogel:component cerbos begin
  cerbos:
    image: ghcr.io/kafeiih/vogel-boilerplate-cerbos:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    build:
      context: ../cerbos
    networks: [authz]
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # vogel:component cerbos end
  api:
    image: ghcr.io/kafeiih/vogel-boilerplate:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    build:
      <<: *build
      target: api
    command: ["server"]
    depends_on:
      postgres:
        condition: service_healthy
      grants:
        condition: service_completed_successfully
      # vogel:component cerbos begin
      cerbos:
        condition: service_healthy
    networks: [default, authz]
    # vogel:component cerbos end
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      <<:
        # vogel:component worker begin
        - *worker-schema
        # vogel:component worker end
        - *scrub-db-admin-secrets
      DB_URL: "postgres://app_runtime:${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in deploy/.env}@postgres:5432/boilerplate_db?sslmode=disable"
      DB_REQUIRE_TLS: "false"
      CERBOS_HOST: ${CERBOS_HOST:?set CERBOS_HOST and CERBOS_PLAINTEXT together in deploy/.env}
      CERBOS_PLAINTEXT: ${CERBOS_PLAINTEXT:?set CERBOS_HOST and CERBOS_PLAINTEXT together in deploy/.env}

  # vogel:component worker begin
  worker:
    image: ghcr.io/kafeiih/vogel-boilerplate-worker:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    build:
      <<: *build
      target: worker
    command: ["server"]
    depends_on:
      postgres:
        condition: service_healthy
      grants:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: [*worker-schema, *scrub-db-admin-secrets]
      DB_URL: "postgres://app_runtime:${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in deploy/.env}@postgres:5432/boilerplate_db?sslmode=disable"
      DB_REQUIRE_TLS: "false"
    restart: unless-stopped

  # vogel:component worker end
# vogel:component cerbos begin
networks:
  authz:
    internal: true

# vogel:component cerbos end
volumes:
  pgdata:
