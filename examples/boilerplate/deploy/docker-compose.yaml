# vogel:component worker begin
x-worker-schema: &worker-schema
  WORKER_SCHEMA: ${WORKER_SCHEMA:-river}

# vogel:component worker end
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-build: &build
  context: ../../..
  dockerfile: examples/boilerplate/Dockerfile

# create_host_path: false makes a missing bundle fail `up` instead of mounting an empty directory.
x-rds-ca: &rds-ca
  type: bind
  source: ${RDS_CA_BUNDLE:-./rds-global-bundle.pem}
  target: /etc/ssl/rds/global-bundle.pem
  read_only: true
  bind:
    create_host_path: false

x-scrub-db-admin-secrets: &scrub-db-admin-secrets
  POSTGRES_PASSWORD: ""
  APP_MIGRATOR_PASSWORD: ""

services:
  # No ports and no TLS: non-production hosts only, enabled by COMPOSE_PROFILES=bundled-db in deploy/.env.
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: ["bundled-db"]
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-boilerplate_db}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-off, on RDS: creates app_migrator and app_runtime with the master user (see RUNBOOK.md section 0).
  db-roles:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    <<: *hardened
    profiles: ["tools"]
    logging: *logging
    # Checked here, not with ${VAR:?}: compose interpolates every service, even those in inactive profiles.
    entrypoint:
      - sh
      - -c
      - ': "$${PGHOST:?set DB_HOST}" "$${PGPASSWORD:?set DB_ADMIN_PASSWORD}" "$${POSTGRES_USER:?set DB_ADMIN_USER}" "$${POSTGRES_DB:?set DB_NAME}" "$${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD}" "$${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD}"; exec sh /initdb/10-roles.sh'
    environment:
      PGHOST: ${DB_HOST:-}
      PGPORT: ${DB_PORT:-5432}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-}
      PGSSLMODE: ${DB_SSLMODE:-verify-full}
      PGSSLROOTCERT: /etc/ssl/rds/global-bundle.pem
      POSTGRES_USER: ${DB_ADMIN_USER:-}
      POSTGRES_DB: ${DB_NAME:-}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:-}
    volumes:
      - *rds-ca
      - ./initdb/10-roles.sh:/initdb/10-roles.sh:ro
    restart: "no"

  migrate:
    image: ghcr.io/kafeiih/vogel-boilerplate:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    logging: *logging
    build:
      <<: *build
      target: api
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      # vogel:component worker begin
      <<: *worker-schema
      # vogel:component worker end
      DB_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in deploy/.env}@${DB_HOST:?set DB_HOST in deploy/.env}:${DB_PORT:-5432}/${DB_NAME:?set DB_NAME in deploy/.env}?sslmode=${DB_SSLMODE:-verify-full}&sslrootcert=/etc/ssl/rds/global-bundle.pem
      DB_REQUIRE_TLS: ${DB_REQUIRE_TLS:-true}
    volumes:
      - *rds-ca
    restart: "no"

  grants:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    <<: *hardened
    logging: *logging
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      # vogel:component worker begin
      - -v
      - worker_schema=${WORKER_SCHEMA:-river}
      # vogel:component worker end
      - -f
      - /grants/runtime-grants.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: ${DB_HOST:?set DB_HOST in deploy/.env}
      PGPORT: ${DB_PORT:-5432}
      PGDATABASE: ${DB_NAME:?set DB_NAME in deploy/.env}
      PGSSLMODE: ${DB_SSLMODE:-verify-full}
      PGSSLROOTCERT: /etc/ssl/rds/global-bundle.pem
      PGUSER: app_migrator
      PGPASSWORD: ${APP_MIGRATOR_PASSWORD:?set APP_MIGRATOR_PASSWORD in deploy/.env}
    volumes:
      - *rds-ca
      - ./initdb/runtime-grants.sql:/grants/runtime-grants.sql:ro
    restart: "no"

  # vogel:component cerbos begin
  cerbos:
    image: ghcr.io/kafeiih/vogel-boilerplate-cerbos:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    logging: *logging
    build:
      context: ../cerbos
    networks: [authz]
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # vogel:component cerbos end
  api:
    image: ghcr.io/kafeiih/vogel-boilerplate:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    logging: *logging
    build:
      <<: *build
      target: api
    command: ["server"]
    depends_on:
      grants:
        condition: service_completed_successfully
      # vogel:component cerbos begin
      cerbos:
        condition: service_healthy
    networks: [default, authz]
    # vogel:component cerbos end
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      <<:
        # vogel:component worker begin
        - *worker-schema
        # vogel:component worker end
        - *scrub-db-admin-secrets
      DB_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in deploy/.env}@${DB_HOST:?set DB_HOST in deploy/.env}:${DB_PORT:-5432}/${DB_NAME:?set DB_NAME in deploy/.env}?sslmode=${DB_SSLMODE:-verify-full}&sslrootcert=/etc/ssl/rds/global-bundle.pem
      CERBOS_HOST: ${CERBOS_HOST:?set CERBOS_HOST and CERBOS_PLAINTEXT together in deploy/.env}
      CERBOS_PLAINTEXT: ${CERBOS_PLAINTEXT:?set CERBOS_HOST and CERBOS_PLAINTEXT together in deploy/.env}
    volumes:
      - *rds-ca
    restart: unless-stopped

  # vogel:component worker begin
  worker:
    image: ghcr.io/kafeiih/vogel-boilerplate-worker:${APP_VERSION:?set APP_VERSION in deploy/.env}
    <<: *hardened
    logging: *logging
    build:
      <<: *build
      target: worker
    command: ["server"]
    depends_on:
      grants:
        condition: service_completed_successfully
      # vogel:component bpms begin
      gotenberg:
        condition: service_healthy
      # vogel:component bpms end
    env_file:
      - .env
    environment:
      <<: [*worker-schema, *scrub-db-admin-secrets]
      DB_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD:?set APP_RUNTIME_PASSWORD in deploy/.env}@${DB_HOST:?set DB_HOST in deploy/.env}:${DB_PORT:-5432}/${DB_NAME:?set DB_NAME in deploy/.env}?sslmode=${DB_SSLMODE:-verify-full}&sslrootcert=/etc/ssl/rds/global-bundle.pem
    volumes:
      - *rds-ca
    restart: unless-stopped

  # vogel:component worker end
  # vogel:component bpms begin
  # Not *hardened: Chromium needs a writable home. Denying every IP and JavaScript keeps templates from fetching anything (no SSRF).
  gotenberg:
    image: gotenberg/gotenberg:8.38.1-chromium@sha256:5da4ab7b8fe7326537369e17b661be765d9a2887f77722faacdbe6d55812fb96
    environment:
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # vogel:component bpms end
# vogel:component cerbos begin
networks:
  authz:
    internal: true

# vogel:component cerbos end
volumes:
  pgdata:
