rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api",status="200"}'
        values: '0+90x150'
      - series: 'http_requests_total{job="api",status="500"}'
        values: '0+10x150'
    alert_rule_test:
      - eval_time: 90m
        alertname: SLOAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The 99.5% availability SLO is burning its error budget fast
              description: 5xx ratio would spend the 30-day budget in days, not weeks. See RUNBOOK.md (errores 5xx).
      - eval_time: 30m
        alertname: SLOAvailabilitySlowBurn
        exp_alerts: []
      - eval_time: 150m
        alertname: SLOAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: The 99.5% availability SLO is spending its error budget faster than it accrues
              description: Open a ticket; at this pace the 30-day budget runs out before the window ends.

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api",status="200"}'
        values: '0+999x150'
      - series: 'http_requests_total{job="api",status="500"}'
        values: '0+1x150'
    alert_rule_test:
      - eval_time: 90m
        alertname: SLOAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 150m
        alertname: SLOAvailabilitySlowBurn
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="api",instance="api:9090"}'
        values: '0x5'
      - series: 'up{job="api",instance="api2:9090"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: api
              instance: api:9090
            exp_annotations:
              summary: The API target is not being scraped

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api",path="/v1/healthz",status="503"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HealthCheckFailing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: /v1/healthz is answering 503; see RUNBOOK.md (DB caida)
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api",path="/v1/healthz",status="200"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: HealthCheckFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="api",path="/slow",le="2.5"}'
        values: '0x15'
      - series: 'http_request_duration_seconds_bucket{job="api",path="/slow",le="5"}'
        values: '0+10x15'
      - series: 'http_request_duration_seconds_bucket{job="api",path="/slow",le="+Inf"}'
        values: '0+10x15'
      - series: 'http_request_duration_seconds_bucket{job="api",path="/fast",le="0.005"}'
        values: '0+10x15'
      - series: 'http_request_duration_seconds_bucket{job="api",path="/fast",le="+Inf"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: HighLatencyP99
        exp_alerts:
          - exp_labels:
              severity: warning
              path: /slow
            exp_annotations:
              summary: "p99 latency above 2s on /slow"

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api",status="429"}'
        values: '0+120x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: RateLimitingExcessive
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: More than 50 requests per minute answered 429
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api",status="429"}'
        values: '0+10x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: RateLimitingExcessive
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'go_goroutines{job="api",instance="api:9090"}'
        values: '1500x12'
      - series: 'go_goroutines{job="api",instance="api2:9090"}'
        values: '200x12'
    alert_rule_test:
      - eval_time: 12m
        alertname: GoroutinesGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: api
              instance: api:9090
            exp_annotations:
              summary: Goroutine count above 1000 for 10 minutes

  - interval: 1m
    input_series:
      - series: 'db_pool_connections_acquired{instance="api:9090"}'
        values: '25x5'
      - series: 'db_pool_connections_max{instance="api:9090"}'
        values: '25x5'
      - series: 'db_pool_connections_acquired{instance="api2:9090"}'
        values: '3x5'
      - series: 'db_pool_connections_max{instance="api2:9090"}'
        values: '25x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: DBPoolExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: api:9090
            exp_annotations:
              summary: "Every pool connection is in use on api:9090"

  - interval: 1m
    input_series:
      - series: 'db_pool_acquire_wait_seconds_bucket{instance="api:9090",le="1"}'
        values: '0x15'
      - series: 'db_pool_acquire_wait_seconds_bucket{instance="api:9090",le="2.5"}'
        values: '0+10x15'
      - series: 'db_pool_acquire_wait_seconds_bucket{instance="api:9090",le="+Inf"}'
        values: '0+10x15'
      - series: 'db_pool_acquire_wait_seconds_bucket{instance="api2:9090",le="0.001"}'
        values: '0+10x15'
      - series: 'db_pool_acquire_wait_seconds_bucket{instance="api2:9090",le="+Inf"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: DBPoolAcquireSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: api:9090
            exp_annotations:
              summary: "p99 wait for a pool connection above 1s on api:9090"
              description: With the default DB_ACQUIRE_TIMEOUT (3s) this is close to requests failing with context.DeadlineExceeded.

  - interval: 1m
    input_series:
      - series: 'db_pool_conn_hold_seconds_count{instance="prom3:9090"}'
        values: '0+5x10'
      - series: 'db_pool_conn_hold_seconds_bucket{instance="prom3:9090",le="10.0"}'
        values: '0+4x10'
      - series: 'db_pool_conn_hold_seconds_count{instance="prom2:9090"}'
        values: '0+5x10'
      - series: 'db_pool_conn_hold_seconds_bucket{instance="prom2:9090",le="10"}'
        values: '0+4x10'
      - series: 'db_pool_conn_hold_seconds_count{instance="healthy:9090"}'
        values: '0+5x10'
      - series: 'db_pool_conn_hold_seconds_bucket{instance="healthy:9090",le="10"}'
        values: '0+5x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: DBConnectionHeldTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: prom3:9090
            exp_annotations:
              summary: "Connections held longer than DB_LEAK_THRESHOLD on prom3:9090"
              description: The api/worker log has a WARN naming the code that acquired them.
          - exp_labels:
              severity: warning
              instance: prom2:9090
            exp_annotations:
              summary: "Connections held longer than DB_LEAK_THRESHOLD on prom2:9090"
              description: The api/worker log has a WARN naming the code that acquired them.

  - interval: 1m
    input_series:
      - series: 'db_pool_conn_hold_seconds_count{instance="nobucket:9090"}'
        values: '0+5x20'
      - series: 'db_pool_conn_hold_seconds_bucket{instance="nobucket:9090",le="30"}'
        values: '0+5x20'
      - series: 'db_pool_conn_hold_seconds_count{instance="ok:9090"}'
        values: '0+5x20'
      - series: 'db_pool_conn_hold_seconds_bucket{instance="ok:9090",le="10"}'
        values: '0+5x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: DBLeakAlertBucketMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: nobucket:9090
            exp_annotations:
              summary: "DBConnectionHeldTooLong cannot fire on nobucket:9090: no le=10 bucket"
  # vogel:component worker begin

  - interval: 1m
    input_series:
      - series: 'up{job="worker",instance="worker:9091"}'
        values: '0x5'
      - series: 'up{job="worker",instance="worker2:9091"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: WorkerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: worker
              instance: worker:9091
            exp_annotations:
              summary: The worker target is not being scraped
              description: Jobs are not being processed or not observed. See RUNBOOK.md (worker).

  - interval: 1m
    input_series:
      - series: 'river_job_duration_seconds_count{job="worker",kind="send_email",outcome="success"}'
        values: '0+7x20'
      - series: 'river_job_duration_seconds_count{job="worker",kind="send_email",outcome="error"}'
        values: '0+2x20'
      - series: 'river_job_duration_seconds_count{job="worker",kind="send_email",outcome="panic"}'
        values: '0+1x20'
      - series: 'river_job_duration_seconds_count{job="worker",kind="example",outcome="success"}'
        values: '0+99x20'
      - series: 'river_job_duration_seconds_count{job="worker",kind="example",outcome="error"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: WorkerJobErrorRatioHigh
        exp_alerts: []
      - eval_time: 18m
        alertname: WorkerJobErrorRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: send_email
            exp_annotations:
              summary: "More than 10% of send_email job attempts fail"
              description: The worker log has the job errors; see RUNBOOK.md (worker).

  - interval: 1m
    input_series:
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="report",le="1"}'
        values: '0x20'
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="report",le="60"}'
        values: '0x20'
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="report",le="120"}'
        values: '0+5x20'
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="report",le="+Inf"}'
        values: '0+5x20'
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="send_email",le="1"}'
        values: '0+5x20'
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="send_email",le="60"}'
        values: '0+5x20'
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="send_email",le="120"}'
        values: '0+5x20'
      - series: 'river_job_duration_seconds_bucket{job="worker",kind="send_email",le="+Inf"}'
        values: '0+5x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: WorkerJobSlowP95
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: report
            exp_annotations:
              summary: "p95 duration of report jobs above 60s"
  # vogel:component worker end
