services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluprint_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # vogel:component cerbos begin
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.57.0@sha256:e5e3b150b3cb0090975605254f255164567d67e233634199fb20972e3eaff300
    command: ["server", "--config=/config/.cerbos.yaml"]
    volumes:
      - ../cerbos/.cerbos.yaml:/config/.cerbos.yaml:ro
      - ../cerbos/policies:/bundle/policies:ro
    ports:
      - "3593:3593"
      - "3592:3592"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # vogel:component cerbos end
  # vogel:component bpms begin
  # HTML-to-PDF for the BPMS base's documents (GOTENBERG_URL in .env). Port 3001
  # on loopback, so it never takes the frontend's 3000; Chromium may fetch nothing.
  gotenberg:
    image: gotenberg/gotenberg:8.39.0-chromium@sha256:558943677cf9092df83ff654c2645856dcb9ddf777f359243789688e74f3bcdd
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # vogel:component bpms end
volumes:
  pgdata_dev:
