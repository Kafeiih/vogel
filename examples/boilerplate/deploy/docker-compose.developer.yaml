services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluprint_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # vogel:component cerbos begin
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.58.0@sha256:ef8fcc8b7a1b67fab17023113947b8f549a6225abca6cd693725242ad09322b4
    command: ["server", "--config=/config/.cerbos.yaml"]
    volumes:
      - ../cerbos/.cerbos.yaml:/config/.cerbos.yaml:ro
      - ../cerbos/policies:/bundle/policies:ro
    ports:
      - "3593:3593"
      - "3592:3592"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # vogel:component cerbos end
  # vogel:component bpms begin
  # HTML-to-PDF for the BPMS base's documents (GOTENBERG_URL in .env). Port 3001
  # on loopback, so it never takes the frontend's 3000; Chromium may fetch nothing.
  gotenberg:
    image: gotenberg/gotenberg:9.9.2-chromium@sha256:eeba4cefc62158e87be8374aa6f5f5eb266d62051524f304f5f97522dbb634dc
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # vogel:component bpms end
volumes:
  pgdata_dev:
