services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluprint_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # vogel:component cerbos begin
  cerbos:
    image: ghcr.io/cerbos/cerbos:0.56.0@sha256:540643bc67ba628011a150ad1d3370f285daa38995be5cd7a4be181da902bec1
    command: ["server", "--config=/config/.cerbos.yaml"]
    volumes:
      - ../cerbos/.cerbos.yaml:/config/.cerbos.yaml:ro
      - ../cerbos/policies:/bundle/policies:ro
    ports:
      - "3593:3593"
      - "3592:3592"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # vogel:component cerbos end
  # vogel:component bpms begin
  # HTML-to-PDF for the BPMS base's documents (GOTENBERG_URL in .env). Port 3001
  # on loopback, so it never takes the frontend's 3000; Chromium may fetch nothing.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1-chromium@sha256:5da4ab7b8fe7326537369e17b661be765d9a2887f77722faacdbe6d55812fb96
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # vogel:component bpms end
volumes:
  pgdata_dev:
