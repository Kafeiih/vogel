version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directories:
      - /
      # vogel:component cerbos begin
      # Bump together with the Cerbos image in deploy/docker-compose.developer.yaml.
      - /cerbos
      # vogel:component cerbos end
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    # A Postgres major needs a data migration; upgrade it deliberately.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
