name: CI

# No paths-ignore: required checks must always report, or doc-only PRs block.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --build-tags=integration

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -cover

  prometheus-rules:
    name: Prometheus rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check and test rules
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
        run: |
          set -euo pipefail
          promtool() {
            docker run --rm --entrypoint promtool \
              -v "$PWD/deploy/prometheus:/rules:ro" -w /rules \
              "$PROMETHEUS_IMAGE" "$@"
          }
          promtool check rules alerts.yml
          promtool test rules alerts_test.yml

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan
        run: govulncheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  trivy:
    name: Trivy image + config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      TRIVY_NO_PROGRESS: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned CLI, not trivy-action: that action's tags were rewritten in a supply-chain attack.
      - name: Install trivy
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      - name: Scan config
        run: '"$RUNNER_TEMP/trivy" config --severity HIGH,CRITICAL --exit-code 1 .'

      - name: Build images
        run: |
          set -euo pipefail
          docker build --build-arg APP_DIR=. --target api -t app:api .
          # vogel:component worker begin
          docker build --build-arg APP_DIR=. --target worker -t app:worker .
          # vogel:component worker end
          # vogel:component cerbos begin
          docker build -t app:cerbos cerbos
          # vogel:component cerbos end

      - name: Scan images
        run: |
          set -uo pipefail
          status=0
          "$RUNNER_TEMP/trivy" image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 app:api || status=1
          # vogel:component worker begin
          "$RUNNER_TEMP/trivy" image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 app:worker || status=1
          # vogel:component worker end
          # vogel:component cerbos begin
          "$RUNNER_TEMP/trivy" image --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile cerbos/.trivyignore \
            --exit-code 1 app:cerbos || status=1
          # vogel:component cerbos end
          exit "$status"

  # vogel:component cerbos begin
  cerbos:
    name: Cerbos policies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Policy tests
        run: cerbos/test.sh

      - name: Smoke test
        run: cerbos/smoke.sh

  # vogel:component cerbos end
  release-template:
    name: Release image names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: image-ref test
        run: .github/workflows/image-ref_test.sh

      - name: sign-image test
        run: .github/workflows/sign-image_test.sh

      - name: verify-images test
        run: deploy/verify-images_test.sh
