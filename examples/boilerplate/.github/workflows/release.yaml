name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Build api image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and version
        id: image
        run: .github/workflows/image-ref.sh "" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: api
          build-args: APP_DIR=.
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.image.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # vogel:component worker begin
  worker:
    name: Build worker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and version
        id: image
        run: .github/workflows/image-ref.sh -worker >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: worker
          build-args: APP_DIR=.
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.image.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # vogel:component worker end
  # vogel:component cerbos begin
  cerbos:
    name: Build and smoke-test Cerbos image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name and version
        id: image
        run: .github/workflows/image-ref.sh -cerbos >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cerbos
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.image.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=cerbos
          cache-to: type=gha,mode=max,scope=cerbos

      - name: Smoke test the pushed digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: ./cerbos/smoke.sh "$IMAGE"

  # vogel:component cerbos end
  publish:
    name: Tag the release
    needs:
      - api
      # vogel:component worker begin
      - worker
      # vogel:component worker end
      # vogel:component cerbos begin
      - cerbos
      # vogel:component cerbos end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag every digest
        env:
          API_DIGEST: ${{ needs.api.outputs.digest }}
          # vogel:component worker begin
          WORKER_DIGEST: ${{ needs.worker.outputs.digest }}
          # vogel:component worker end
          # vogel:component cerbos begin
          CERBOS_DIGEST: ${{ needs.cerbos.outputs.digest }}
          # vogel:component cerbos end
        run: |
          set -euo pipefail
          tag() {
            local out name ref
            out="$(.github/workflows/image-ref.sh "$1")"
            name="$(sed -n 's/^name=//p' <<<"$out")"
            ref="$(sed -n 's/^ref=//p' <<<"$out")"
            for attempt in 1 2 3; do
              if docker buildx imagetools create --tag "$ref" "${name}@${2:?missing digest for image $1}"; then
                return 0
              fi
              echo "tagging $ref failed (attempt $attempt), retrying" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          tag "" "$API_DIGEST"
          # vogel:component worker begin
          tag -worker "$WORKER_DIGEST"
          # vogel:component worker end
          # vogel:component cerbos begin
          tag -cerbos "$CERBOS_DIGEST"
          # vogel:component cerbos end
