services:
  postgres:
    # Exact version and multi-arch digest; Dependabot proposes the bumps.
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: vogel_example
      POSTGRES_PASSWORD: vogel_example
      POSTGRES_DB: vogel_example
    ports:
      # 55432 on the host so this example never collides with a PostgreSQL
      # already listening on the default 5432. Inside the container it is
      # still the usual 5432.
      - "55432:5432"
    volumes:
      - vogel_example_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vogel_example -d vogel_example"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vogel_example_postgres_data:
