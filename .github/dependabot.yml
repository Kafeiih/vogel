# Keeps the SHA-pinned actions in .github/workflows and the Go modules
# current. Dependabot rewrites both the commit SHA and the trailing
# "# vX.Y.Z" comment of each action.
#
# Go modules are listed too, for both modules in this repository (the root
# library and examples/boilerplate, which has its own go.mod). govulncheck in
# CI and Dependabot do different jobs: govulncheck fails only when the code
# reaches a function with a KNOWN vulnerability, so it says nothing about a
# dependency that is merely old, and it reacts only after an advisory is
# published; Dependabot keeps dependencies current, so a fix is a small,
# routine bump instead of a jump across many releases under pressure. Each
# directory gets one grouped weekly PR, so the noise stays at one review per
# module per week.
#
# The boilerplate's Dockerfile and the compose files under examples/ are
# covered too: Dependabot bumps image tags, and rewrites the digest together
# with the tag where an image is pinned by digest, so the base images do not
# quietly age into known-vulnerable ones. In each docker-compose directory
# Dependabot reads every file matching (docker-)?compose(-\w+)?(.[\w-]+)?.ya?ml,
# so /examples/boilerplate/deploy covers docker-compose.developer.yaml too.
version: 2
updates:
  # examples/boilerplate/.github holds the template release workflow a
  # generated service runs; its pinned actions are bumped like the root's.
  - package-ecosystem: github-actions
    directories:
      - /
      - /examples/boilerplate
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod-root:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: gomod
    directory: /examples/boilerplate
    schedule:
      interval: weekly
    groups:
      gomod-boilerplate:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)

  # cerbos/ has its own Dockerfile (the PDP image); its Cerbos pin must move
  # together with the one in deploy/docker-compose.developer.yaml, which the
  # docker-compose updater below bumps in a separate PR.
  - package-ecosystem: docker
    directories:
      - /examples/boilerplate
      - /examples/boilerplate/cerbos
    schedule:
      interval: weekly
    groups:
      docker-boilerplate:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)

  # A Postgres major bump is a migration, not a routine update: a data
  # directory written by one major does not start under the next (and the
  # official image moved PGDATA in 18), so existing deploy volumes would
  # break. Majors are upgraded deliberately; minors and digests stay current.
  - package-ecosystem: docker-compose
    directories:
      - /examples/api
      - /examples/boilerplate/deploy
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
