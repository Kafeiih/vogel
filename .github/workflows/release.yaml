name: Release

# On every version tag, build a CycloneDX SBOM for each Go module in this
# repository and attach them to the GitHub Release of that tag (created if
# it does not exist yet, updated if it does).
on:
  push:
    tags: ["v*"]

# Least privilege: everything runs read-only except the one job that writes
# the release, and that job neither checks out the repository nor runs the
# SBOM generator: it only downloads the files and calls gh.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned: a new release of the generator must not change the SBOM
      # without a change in this repository. Bump it by hand.
      CYCLONEDX_GOMOD_VERSION: v1.12.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so the generator records the tag as the
          # main component's version.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # vogel is the library consumers import; the boilerplate is a separate
      # module (its own go.mod) with dependencies the root does not have.
      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          tool="github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          mkdir -p sbom
          go run "$tool" mod -json -output sbom/vogel.cdx.json .
          go run "$tool" mod -json -output sbom/vogel-boilerplate.cdx.json examples/boilerplate
          (cd sbom && sha256sum ./*.cdx.json > SHA256SUMS)
          cat sbom/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach SBOMs to the release
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      # No checkout: gh gets the repository from GH_REPO, so this job holds a
      # write token without running any code from the repository.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber \
            sbom/vogel.cdx.json sbom/vogel-boilerplate.cdx.json sbom/SHA256SUMS
