name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", ".atl/**"]
  pull_request:
    branches: [main, master]
    # 'labeled' permite disparar la integracion al agregar el label justo antes de mergear.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ["**.md", "docs/**", ".atl/**"]

# Cancela corridas viejas del mismo PR/rama cuando se pushea de nuevo:
# no se paga por builds que ya quedaron obsoletos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Feedback barato en CADA push/PR: lint + unit + build en un solo job
  # (un unico checkout + setup-go, sin pagar 3x el arranque).
  fast:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          # Sin --build-tags=integration el linter NO mira ningun archivo con
          # //go:build integration. Los tags son aditivos, asi que esta corrida
          # cubre tambien los archivos sin tag.
          args: --build-tags=integration

      - name: Unit tests
        run: go test ./... -race -cover -coverprofile=coverage-unit.out

      # vogel es una libreria: no hay ./cmd/api que compilar. 'go build ./...'
      # igual es necesario porque 'go test' no compila los paquetes sin tests
      # (storage, authz, httpx/response, audit/migrations, audit/postgres).
      - name: Build
        run: go build ./...

      # Un puerto que arrastra su adaptador rompe la premisa del modulo: importar
      # 'auth' no debe traer net/http, y 'audit' no debe traer chi ni httpx.
      # El compilador no lo detecta; esto si.
      - name: Verificar aislamiento de los puertos
        run: |
          set -euo pipefail
          check() {
            local pkg="$1" forbidden="$2"
            if go list -deps "$pkg" | grep -qxF "$forbidden"; then
              echo "::error::$pkg depende de $forbidden"
              exit 1
            fi
          }
          check ./auth net/http
          check ./audit net/http
          check ./audit github.com/go-chi/chi/v5
          check ./workflow net/http
          check ./audit github.com/kafeiih/vogel/httpx/middleware
          check ./storage github.com/aws/aws-sdk-go-v2/service/s3
          check ./notification github.com/wneessen/go-mail
          check ./authz github.com/cerbos/cerbos-sdk-go/cerbos

          # worker es el unico paquete que puede depender de River. Si River
          # aparece en otro, un consumidor que solo queria encolar -o ni eso-
          # se lleva la cola de trabajos entera.
          #
          # examples/ tambien queda fuera del barrido: un ejemplo ejecutable
          # es un CONSUMIDOR, no un puerto -- se espera que importe worker (y
          # por lo tanto River) para mostrar como se encola trabajo desde una
          # API real. Excluirlo mantiene la guarda con sentido para los
          # paquetes de la biblioteca, que es lo que este chequeo protege.
          for pkg in $(go list ./... | grep -v '/worker$' | grep -v '/examples/'); do
            if go list -deps "$pkg" 2>/dev/null | grep -qxF "github.com/riverqueue/river"; then
              echo "::error::$pkg depende de River, y solo ./worker deberia"
              exit 1
            fi
          done
          echo "Puertos aislados: OK"

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage-unit.out
          retention-days: 30

  # examples/boilerplate tiene su propio go.mod (con un 'replace' hacia la
  # raiz de este repo), asi que es un modulo Go aparte: 'go build ./...' y
  # 'go test ./...' corridos desde la raiz NO lo alcanzan. Este job compila y
  # testea ese modulo anidado por separado, y de paso funciona como test de
  # regresion de la API publica de vogel contra un consumidor real.
  boilerplate:
    name: Boilerplate example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/boilerplate/go.mod

      # Same linter version and the root .golangci.yml: the boilerplate is the
      # template consumers copy, so it is held to the library's rules.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: examples/boilerplate
          args: --config ../../.golangci.yml --build-tags=integration

      - name: Build
        run: cd examples/boilerplate && go build ./...

      - name: Test
        run: cd examples/boilerplate && go test ./... -race -cover

      # Policies compile and pass their tests (the Dockerfile's validate
      # stage), then the built PDP image serves them: an empty or misrouted
      # policy store starts healthy and denies everything, which only the
      # smoke test's ALLOW checks catch.
      - name: Cerbos policies
        run: examples/boilerplate/cerbos/test.sh

      - name: Cerbos smoke test
        run: examples/boilerplate/cerbos/smoke.sh

      # The template release workflow never runs in vogel; its tag and image
      # name logic is tested here instead.
      - name: Release template image names
        run: examples/boilerplate/.github/workflows/image-ref_test.sh

      # create-vogel-app turns this boilerplate into new repositories by
      # deleting component-marked blocks. Generate every combination from this
      # checkout and build, vet and test each, so a marker placed wrong fails
      # here instead of in someone's new service.
      - name: Generated projects
        run: cmd/create-vogel-app/check-generated.sh

  # Vulnerabilidades conocidas en dependencias, usando el call graph: solo
  # falla cuando el codigo de vogel (o del boilerplate) ALCANZA la funcion
  # vulnerable, no por el mero hecho de requerir el modulo. Corre sobre los
  # dos modulos porque el boilerplate es un modulo Go aparte, con su propio
  # go.mod/go.sum y dependencias que la raiz no tiene (River, entre otras).
  #
  # Este job depende de la base de datos de vuln.go.dev en el momento de
  # correr, no solo del diff: un advisory nuevo puede poner en rojo un PR que
  # no toco ninguna dependencia. Cuando pase, el arreglo es un bump de la
  # dependencia afectada (en un PR aparte si hace falta), no es tarea del
  # autor del PR que quedo en rojo.
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Version fija: un release nuevo del scanner no debe cambiar el
      # resultado de CI sin un cambio en este repo. Se sube a mano.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan vogel
        run: govulncheck ./...

      - name: Scan boilerplate
        run: cd examples/boilerplate && govulncheck ./...

  # Tests de integracion (testcontainers + postgres): lo mas caro del set.
  # Corren SOLO en un PR con el label 'run-integration', que se agrega al ir
  # a mergear. Asi no se pagan en cada push intermedio.
  integration:
    name: Integration
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Integration tests
        run: go test -tags=integration ./... -race -cover -coverprofile=coverage-integration.out

      - name: Boilerplate integration tests
        run: cd examples/boilerplate && go test -tags=integration ./... -race

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage-integration.out
          retention-days: 30
